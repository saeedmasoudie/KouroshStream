<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KouroshStream - Movies & Series Streaming</title>
    <meta name="description" content="The ultimate destination for movie enthusiasts. Stream and download your favorite movies and series in the highest quality.">
    
    <!-- Performance & SEO Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="//www.youtube.com">
    <link rel="dns-prefetch" href="//image.tmdb.org">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="KouroshStream - Movies & Series Streaming">
    <meta property="og:description" content="The ultimate destination for movie enthusiasts. Stream and download your favorite movies and series in the highest quality.">
    <meta property="og:image" content="/og-image.jpg">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="KouroshStream - Movies & Series Streaming">
    <meta property="twitter:description" content="The ultimate destination for movie enthusiasts. Stream and download your favorite movies and series in the highest quality.">
    <meta property="twitter:image" content="/og-image.jpg">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#8b5cf6">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
