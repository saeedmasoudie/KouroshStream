<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="filmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Film strip -->
  <rect x="15" y="25" width="70" height="50" rx="3" fill="url(#filmGrad)"/>
  <!-- Film holes -->
  <rect x="20" y="30" width="5" height="5" fill="#1a1a2e"/>
  <rect x="20" y="45" width="5" height="5" fill="#1a1a2e"/>
  <rect x="20" y="60" width="5" height="5" fill="#1a1a2e"/>
  <rect x="75" y="30" width="5" height="5" fill="#1a1a2e"/>
  <rect x="75" y="45" width="5" height="5" fill="#1a1a2e"/>
  <rect x="75" y="60" width="5" height="5" fill="#1a1a2e"/>
  <!-- Play button in center -->
  <circle cx="50" cy="50" r="15" fill="white" opacity="0.9"/>
  <path d="M 45 42 L 58 50 L 45 58 Z" fill="#8b5cf6"/>
</svg>
